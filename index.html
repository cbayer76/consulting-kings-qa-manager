<script>
/* ============================ STORAGE (shared artifact database) ============================ */
/* One document per record in six collections. Writes only touch records that changed, so two people
   editing different questions never overwrite each other. Live updates arrive through onSnapshot. */
const COLLS=['users','projects','meetings','sections','questions','answers'];
let DB=null, hasStore=false, synced=false, lastBase={};
let memFallback=null;
const dbCache={}; COLLS.forEach(function(c){ dbCache[c]={}; });
let pendingRender=false;

function delay(ms){ return new Promise(function(res){ setTimeout(res,ms); }); }
async function withRetries(fn, attempts, baseDelay){
  let lastErr;
  for(let i=0;i<attempts;i++){
    try{ return await fn(); }
    catch(e){ lastErr=e; if(i<attempts-1) await delay(baseDelay*(i+1)); }
  }
  throw lastErr;
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function stable(v){
  if(v===null || typeof v!=='object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(stable).join(',')+']';
  return '{'+Object.keys(v).filter(function(k){return v[k]!==undefined;}).sort().map(function(k){ return JSON.stringify(k)+':'+stable(v[k]); }).join(',')+'}';
}
function canon(d){
  const o={};
  COLLS.forEach(function(c){ o[c]=(d[c]||[]).map(stable).sort(); });
  return JSON.stringify(o);
}
async function getDb(){
  try{ if(window.claude && typeof window.claude.use==='function') return await window.claude.use('db'); }catch(e){}
  return null;
}
function remoteState(){
  const d={};
  COLLS.forEach(function(c){ d[c]=Object.keys(dbCache[c]).sort().map(function(id){ return clone(dbCache[c][id]); }); });
  return d;
}
function startSync(){
  return new Promise(function(resolve){
    const definitive={}; let done=false;
    function finish(ok){ if(done) return; done=true; synced=true; resolve(ok); }
    setTimeout(function(){ finish(false); }, 8000);
    COLLS.forEach(function(c){
      DB.collection(c).onSnapshot(function(snap){
        const rows={};
        snap.docs.forEach(function(doc){ rows[doc.id]=clone(doc.data()); });
        dbCache[c]=rows;
        if(!snap.metadata.fromCache) definitive[c]=true;
        if(!done){ if(COLLS.every(function(x){return definitive[x];})) finish(true); }
        else onRemoteChange();
      }, function(err){
        console.error('snapshot error',c,err);
        definitive[c]=true;
        if(!done && COLLS.every(function(x){return definitive[x];})) finish(false);
        toast('⚠ Live updates stopped ('+(err&&err.code?err.code:'error')+') — reload the page');
      });
    });
  });
}

async function storeGet(){
  if(!hasStore) return migrate(memFallback);
  if(!synced) return null;
  const d=remoteState();
  if(!d.users.length && !d.projects.length){ lastBase={}; return null; }
  lastBase={};
  COLLS.forEach(function(c){ lastBase[c]={}; d[c].forEach(function(item){ lastBase[c][item.id]=stable(item); }); });
  return migrate(d);
}
async function storeSet(data){
  if(!hasStore){ memFallback=data; return true; }
  const base=lastBase; const ops=[];
  COLLS.forEach(function(c){
    const next={};
    (data[c]||[]).forEach(function(item){ if(item && item.id) next[item.id]=item; });
    const bc=base[c]||{};
    Object.keys(next).forEach(function(id){
      const body=clone(next[id]);
      if(bc[id]!==stable(body)) ops.push({c:c,id:id,body:body});
    });
    Object.keys(bc).forEach(function(id){ if(!(id in next)) ops.push({c:c,id:id,del:true}); });
  });
  if(!ops.length) return true;
  let failed=0, i=0;
  async function worker(){
    while(i<ops.length){
      const op=ops[i++];
      try{
        const ref=DB.collection(op.c).doc(op.id);
        await withRetries(function(){ return op.del ? ref.delete() : ref.set(op.body); }, 2, 400);
        if(!base[op.c]) base[op.c]={};
        if(op.del){ delete dbCache[op.c][op.id]; delete base[op.c][op.id]; }
        else { dbCache[op.c][op.id]=op.body; base[op.c][op.id]=stable(op.body); }
      }catch(e){ failed++; console.error('write failed',op.c,op.id,e); }
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
  if(failed){
    toast('⚠ Save failed for '+failed+' item(s) — your change stays visible but is NOT saved. Check that you have edit access, then try again.');
    return false;
  }
  return true;
}

/* Live updates from other people. Never re-render while someone is typing or has a dialog open. */
function onRemoteChange(){ pendingRender=true; flushRemote(); }
function flushRemote(){
  if(!pendingRender || !hasStore) return;
  if(!STATE){
    const first=remoteState();
    if(first.users.length || first.projects.length){ pendingRender=false; STATE=migrate(first); render(); }
    return;
  }
  const a=document.activeElement;
  if(a && (a.tagName==='TEXTAREA' || a.tagName==='INPUT' || a.tagName==='SELECT')) return;
  if(UI.exportOpen || UI.bulkOpen || UI.transcriptOpen || UI.pwModal || UI.inputModal || UI.confirmModal) return;
  const d=remoteState();
  if(!d.users.length && !d.projects.length){ pendingRender=false; return; }
  const m=migrate(d);
  pendingRender=false;
  if(canon(m)===canon(STATE)) return;
  STATE=m; render();
}
setInterval(flushRemote, 2500);

/* ============================ ADMIN SESSION MEMORY (this device, 24h) ============================ */
const SESSION_KEY='consultingkings_admin_sessions_v1';
const SESSION_HOURS=24;
let memSessions={};
async function getAdminSessions(){
  try{ const v=localStorage.getItem(SESSION_KEY); return v?JSON.parse(v):{}; }
  catch(e){ return memSessions; }
}
async function setAdminSessions(obj){
  memSessions=obj;
  try{ localStorage.setItem(SESSION_KEY,JSON.stringify(obj)); }catch(e){}
}
async function isAdminSessionValid(userId){
  const sessions=await getAdminSessions();
  const exp=sessions[userId];
  return !!(exp && Date.now()<exp);
}
async function rememberAdminSession(userId){
  const sessions=await getAdminSessions();
  sessions[userId]=Date.now()+SESSION_HOURS*60*60*1000;
  await setAdminSessions(sessions);
}
async function forgetAdminSession(userId){
  const sessions=await getAdminSessions();
  if(userId in sessions){ delete sessions[userId]; await setAdminSessions(sessions); }
}
async function forgetAllAdminSessions(){ await setAdminSessions({}); }

/* ============================ MIGRATION ============================ */
function migrate(d){
  if(!d) return d;
  if(!Array.isArray(d.meetings)){
    const ov=uid('mtg');
    d.meetings=[{id:ov,name:'Overall questions',isOverall:true,createdAt:new Date().toISOString()}];
    (d.sections||[]).forEach(function(s){ if(!s.meetingId) s.meetingId=ov; });
    (d.questions||[]).forEach(function(q){ if(!q.meetingId) q.meetingId=ov; });
  }
  if(!d.meetings.some(function(m){return m.isOverall;}) && d.meetings.length){ d.meetings[0].isOverall=true; }
  (d.questions||[]).forEach(function(q){
    if(!('result' in q)) q.result=null;
    if(!('resultFromAnswerId' in q)) q.resultFromAnswerId=null;
    if(!('resultBy' in q)) q.resultBy=null;
    if(!('resultAt' in q)) q.resultAt=null;
  });
  (d.users||[]).forEach(function(u){ if(!('pinHash' in u)) u.pinHash=null; if(!('isAuto' in u)) u.isAuto=false; });
  if(!Array.isArray(d.projects)){
    const pid=uid('prj');
    const memberIds=(d.users||[]).filter(function(u){return !u.isAuto;}).map(function(u){return u.id;});
    d.projects=[{id:pid,name:'Consulting Kings',createdAt:new Date().toISOString(),memberIds:memberIds}];
    (d.meetings||[]).forEach(function(m){ if(!m.projectId) m.projectId=pid; });
    (d.users||[]).forEach(function(u){ if(u.isAdmin) u.isSuperAdmin=true; });
  }
  (d.users||[]).forEach(function(u){ if(!('isSuperAdmin' in u)) u.isSuperAdmin=false; if(!('isViewer' in u)) u.isViewer=false; });
  (d.questions||[]).forEach(function(q){ syncStatus(d,q); });
  return d;
}

async function mutate(fn){
  const fresh=await storeGet();
  let data = fresh ? fresh : (STATE ? JSON.parse(JSON.stringify(STATE)) : null);
  if(!data) data=seed();
  fn(data);
  const ok=await storeSet(data);
  STATE=data;
  render();
  return ok;
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
function normalizeQ(t){
  return String(t||'')
    .toLowerCase()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^\w\s]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function findDuplicateInMeeting(mid, text, excludeId){
  const norm=normalizeQ(text);
  if(!norm) return null;
  return STATE.questions.find(function(q){ return q.meetingId===mid && q.id!==excludeId && normalizeQ(q.text)===norm; }) || null;
}
function duplicateNotice(dup){
  const sec=STATE.sections.find(function(s){ return s.id===dup.sectionId; });
  return 'Already exists'+(sec?(' in "'+sec.title+'"'):'')+':\n\n"'+dup.text+'"\n\nStatus: '+(STATUS_LABEL[dup.status]||dup.status);
}
function fallbackHash(str){
  str=String(str);
  let h1=0x811c9dc5>>>0, h2=0x1000193>>>0;
  for(let i=0;i<str.length;i++){
    const c=str.charCodeAt(i);
    h1=(h1^c)>>>0; h1=Math.imul(h1,16777619)>>>0;
    h2=((h2+c)*31+i)>>>0; h2=Math.imul(h2,2246822519)>>>0;
  }
  return 'fb'+h1.toString(16).padStart(8,'0')+h2.toString(16).padStart(8,'0')+String(str.length);
}
async function sha256Hex(str){
  try{
    if(typeof crypto!=='undefined' && crypto.subtle && typeof crypto.subtle.digest==='function'){
      const enc=new TextEncoder().encode(String(str));
      const buf=await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    }
  }catch(e){ /* fall through to fallback below */ }
  return fallbackHash(str);
}

/* A section's status: solved when every question has a result, open when any question has no answer yet, otherwise in discussion. */
function sectionStatus(secId){

}

    let html=dashboardHTML();
    if(UI.confirmModal) html+=confirmModalHTML();
    app.innerHTML=html;
    return;
  }
  const warn = !hasStore ? '<div class="storage-warn">Shared storage is not available in this view, so entries are kept only in memory and are lost on refresh (and not shared). Open this tool inside the Claude app/website for shared, persistent storage.</div>' : '';
  if(!UI.currentProjectId || !currentProject()){
    let html=warn+projectsHTML();
    if(UI.confirmModal) html+=confirmModalHTML();
    if(UI.manageAccessModal) html+=manageAccessModalHTML();
    app.innerHTML=html;
    return;
  }
  if(!UI.currentMeetingId || !currentMeeting()){
    let html=warn+landingHTML();
    if(UI.pwModal) html+=passwordModalHTML();
    if(UI.confirmModal) html+=confirmModalHTML();
    app.innerHTML=html;
    focusPwInput();
    return;
  }

  let html=warn;
  html+=statsHTML();
  if(isAdmin()&&UI.adminOpen) html+=adminHTML();
  if(isAdmin()&&UI.bulkStatusMode) html+=bulkStatusPanelHTML();
  const secs=meetingSections(UI.currentMeetingId);
  const shownSecs=secs.filter(function(sec){ return sectionMatchesFilter(sec.id); });
  if(!secs.length) html+=emptyMeetingHTML();
  else if(!shownSecs.length) html+='<p class="empty-hint">No sections match this filter.</p>';
  else html+=shownSecs.map(sectionHTML).join('');
  html+=addSectionHTML();
  if(UI.exportOpen) html+=exportModalHTML();
  if(UI.bulkOpen) html+=bulkModalHTML();
  if(UI.transcriptOpen) html+=transcriptModalHTML();
  if(UI.pwModal) html+=passwordModalHTML();
    if(UI.confirmModal) html+=confirmModalHTML();
  app.innerHTML=html;
  focusPwInput();
}

  const bySection={};
  STATE.sections.filter(function(sec){return meetingIds.indexOf(sec.meetingId)!==-1;}).forEach(function(sec){
    const key=sec.title.toLowerCase();

    STATE.questions.filter(function(q){return q.sectionId===sec.id;}).forEach(function(q){

        '<button class="btn tiny" data-action="'+(m.isOverall?'open-overall':'open-meeting')+'" data-id="'+m.id+'">Open</button>'+
      '</div>';
  }).join('');

    '<div class="field" style="margin-bottom:6px"><button class="btn ghost tiny" data-action="toggle-dashboard">← Back</button></div>'+
    '<h2>Dashboard</h2>'+

      '<span class="stat"><span class="dot open"></span>Open <b>'+tot.open+'</b></span>'+

      '<h3>Meetings in this project</h3>'+

function sectionHTML(sec){
  const collapsed=!!UI.collapsed[sec.id];
  const qs=STATE.questions.filter(function(q){return q.sectionId===sec.id;}).sort(function(a,b){return a.order-b.order;});
  const secs=meetingSections(sec.meetingId);
  const num=secs.findIndex(function(s){return s.id===sec.id;})+1;
  const filtered=qs;
  const solvedN=qs.filter(function(q){return q.status==='solved';}).length;
  const done=qs.length>0 && solvedN===qs.length;
  const pct=qs.length?Math.round(100*solvedN/qs.length):0;
  const visibleNote=qs.length?(solvedN+'/'+qs.length+' solved'):'0 questions';
  let body='';
  if(qs.length===0){
    body+='<p class="empty-hint">No questions yet in this section.</p>';
  }else{
    const activeQs=filtered.filter(function(q){return q.status!=='solved';});
    const solvedQs=filtered.filter(function(q){return q.status==='solved';});
    if(activeQs.length===0 && solvedQs.length>0) body+='<p class="empty-hint">All questions in this section are solved — see below.</p>';
    body+=activeQs.map(function(q){ return questionHTML(q, qs.indexOf(q)+1); }).join('');

      const sCollapsed=UI.solvedCollapsed[sec.id]!==false;

          '<span class="sec-meta">'+solvedQs.length+' question'+(solvedQs.length!==1?'s':'')+'</span>'+
          '<span class="chev" style="'+(sCollapsed?'transform:rotate(-90deg)':'')+'">▾</span>'+
        '</div>'+
        (sCollapsed?'':solvedQs.map(function(q){ return questionHTML(q, qs.indexOf(q)+1); }).join(''));
    }
  }
  const addOpen=!!UI.addQOpen[sec.id];
  body+='<div class="sec-tools">'+
      (canWrite()?'<button class="btn tiny" data-action="toggle-addq" data-id="'+sec.id+'">+ Add question</button>':'')+
      (isAdmin()?'<button class="btn tiny ghost" data-action="rename-section" data-id="'+sec.id+'">Rename</button>'+

/* ============================ EXPORT ============================ */
function orderedSections(){ return STATE.sections.filter(function(s){return s.meetingId===UI.currentMeetingId;}).sort(function(a,b){return a.order-b.order;}); }
function orderedQuestions(secId){ return STATE.questions.filter(function(q){return q.sectionId===secId;}).sort(function(a,b){return a.order-b.order;}); }
function answersFor(qId){ return STATE.answers.filter(function(a){return a.questionId===qId;}).map(function(a){ const u=STATE.users.find(function(x){return x.id===a.userId;}); return {author:u?u.name:'Unknown',text:a.text,updatedAt:a.updatedAt}; }); }

function exportMarkdown(){
  let out='# Consulting Kings — '+currentMeetingName()+'\n\n_Exported '+new Date().toLocaleString()+'_\n';
  orderedSections().forEach(function(s,si){
    out+='\n## '+String(si+1).padStart(2,'0')+' · '+s.title+'\n';
    const qs=orderedQuestions(s.id);
    if(qs.length===0){ out+='\n_(no questions)_\n'; return; }
    qs.forEach(function(q,qi){
      out+='\n**'+(qi+1)+'. '+q.text+'**  \nStatus: '+(STATUS_EXPORT[q.status]||q.status)+'\n';
      if(hasResult(q)) out+='\n> **Result'+(q.resultFromAnswerId?' (from a marked answer)':'')+':** '+String(q.result).replace(/\n/g,'\n> ')+'\n';
      const ans=answersFor(q.id);
      if(ans.length){ out+='\nAnswers:\n'; ans.forEach(function(a){ out+='- _'+a.author+'_ ('+fmtTime(a.updatedAt)+'): '+String(a.text).replace(/\n/g,' ')+'\n'; }); }
    });
  });
  return out;
}
function csvCell(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
function exportCSV(){
  const head=['Workspace','Section','Question No','Question','Status','Result','Result From Answer','Answers'];
  const lines=[head.map(csvCell).join(',')];
  const wn=currentMeetingName();
  orderedSections().forEach(function(s){
    orderedQuestions(s.id).forEach(function(q,qi){
      const aj=answersFor(q.id).map(function(a){ return a.author+': '+a.text; }).join('\n');
      lines.push([wn,s.title,qi+1,q.text,STATUS_EXPORT[q.status]||q.status,hasResult(q)?q.result:'',q.resultFromAnswerId?'yes':'',aj].map(csvCell).join(','));
    });
  });
  return '\ufeff'+lines.join('\r\n');
}
function exportJSON(){
  const data={ exportedAt:new Date().toISOString(), workspace:currentMeetingName(),
    sections: orderedSections().map(function(s,si){ return { no:si+1, title:s.title,
      questions: orderedQuestions(s.id).map(function(q,qi){ return { no:qi+1, question:q.text, status:STATUS_EXPORT[q.status]||q.status,
        result:hasResult(q)?q.result:null, resultFromAnswer:!!q.resultFromAnswerId, answers:answersFor(q.id) }; }) }; }) };
  return JSON.stringify(data,null,2);
}
function buildExport(fmt){ if(fmt==='csv') return exportCSV(); if(fmt==='json') return exportJSON(); return exportMarkdown(); }

function aiSortQuestions(rawText, existingTitles){
  const titles=existingTitles.length?existingTitles.map(function(t){return '- '+t;}).join('\n'):'(none yet)';
  const prompt='You are organizing brainstorming questions for an internal business "decision log" (Consulting Kings, a consulting company offering multichannel marketing, media buying, AI tools integration and conversion boosting).\n\n'+
    'EXISTING SECTIONS in this workspace:\n'+titles+'\n\n'+
    'TASK: Below is raw text containing questions. It may be messy, contain typos, or put several questions on one line.\n'+
    '1. Split it into individual questions.\n'+
    '2. Lightly fix spelling, grammar and capitalization while keeping the original meaning. Keep each item phrased as a question.\n'+
    '3. Assign each question to the MOST fitting existing section, reusing the EXACT section name. If nothing fits, propose a concise NEW section name in UPPERCASE.\n\n'+
    'Return ONLY valid compact JSON (no markdown fences, no commentary) in exactly this shape:\n'+
    '{"sections":["SECTION NAME","..."],"items":[{"q":"corrected question?","s":0}]}\n'+
    'where each item\'s "s" is the index of its section within the "sections" array.\n\n'+
    'RAW TEXT:\n"""\n'+rawText+'\n"""';
  return askJson(prompt);
}

  const qBlock=questionList.map(function(q){ return '['+q.id+'] '+q.text; }).join('\n');
  const prompt='You are analyzing a transcript (from an audio recording — it may contain filler words, mistakes, or informal phrasing) for an internal business decision-log tool (Consulting Kings consulting company).\n\n'+
    'The speaker usually reads a question from a fixed list out loud, then answers it, one after another — though not always cleanly, and there may be tangents or repeated points.\n\n'+
    'EXISTING QUESTIONS IN THIS WORKSPACE (format: [id] question text):\n'+qBlock+'\n\n'+
    'TASK:\n'+
    '1. For each existing question above that was clearly asked and answered in the transcript, extract ONLY the answer content as a clean, faithful statement in the speaker\'s own meaning (light grammar/filler cleanup is fine; do not invent information; do not omit key points). Reference it by its exact [id] from the list above.\n'+
    '2. Separately, detect any genuinely NEW questions raised in the transcript that are NOT covered by the existing list. For each, extract the question text (lightly cleaned) and, if an answer was given right after, extract that answer too.\n\n'+
    'Return ONLY compact JSON, no markdown fences, in exactly this shape:\n'+
    '{"answers":[{"id":"<existing question id>","answer":"..."}],"newQuestions":[{"q":"...","a":"..."}]}\n'+
    'Use an empty string for "a" if no answer was captured for a new question. Use empty arrays if nothing matches or nothing new is found.\n\n'+
    'TRANSCRIPT:\n"""\n'+rawText+'\n"""';
  return askJson(prompt);
}

function aiSuggestResult(qText, answersArr){
  const ansBlock=answersArr.map(function(a,i){ return (i+1)+'. '+a.author+': '+a.text; }).join('\n');
  const prompt='You are reviewing team answers to one question in an internal business decision-log tool (Consulting Kings consulting company).\n\n'+
    'QUESTION: "'+qText+'"\n\n'+
    'ANSWERS FROM THE TEAM:\n'+ansBlock+'\n\n'+
    'TASK: Judge whether these answers converge on a consistent decision. Then propose a concise result statement (max 2-3 sentences) written in a neutral decision-log tone (no "I think", not addressed to anyone), suitable to be recorded as the official answer to this question. If the answers genuinely conflict or there is only vague/no information, set consensus to "none" and leave suggestion empty.\n\n'+
    'Return ONLY compact JSON, no markdown fences, in exactly this shape:\n'+
    '{"consensus":"strong"|"partial"|"none","note":"one short sentence describing the agreement level","suggestion":"proposed result text, or empty string if consensus is none"}';
  return askJson(prompt);
}

function bulkPreviewHTML(res,secs){
  const exByName={}; secs.forEach(function(s){ exByName[s.title.toLowerCase()]=s; });
  const buckets=(res.sections||[]).map(function(name){ const ex=exByName[String(name).toLowerCase()]; return ex?{type:'ex',id:ex.id}:{type:'new',name:String(name)}; });
  const newNames=[]; buckets.forEach(function(b){ if(b.type==='new' && newNames.indexOf(b.name)===-1) newNames.push(b.name); });
  const mid=UI.currentMeetingId;
  const seenNorms={};
  let dupCount=0;
  let rows='';
  (res.items||[]).forEach(function(it,i){
    const b=buckets[it.s]||buckets[0]||{type:'new',name:'IMPORTED QUESTIONS'};
    let opts='';
    secs.forEach(function(s){ opts+='<option value="ex::'+s.id+'" '+((b.type==='ex'&&b.id===s.id)?'selected':'')+'>'+esc(s.title)+'</option>'; });
    newNames.forEach(function(nm){ opts+='<option value="new::'+esc(nm)+'" '+((b.type==='new'&&b.name===nm)?'selected':'')+'>+ '+esc(nm)+' (new)</option>'; });
    if(!secs.length && !newNames.length){ opts='<option value="new::IMPORTED QUESTIONS" selected>+ IMPORTED QUESTIONS (new)</option>'; }
    const norm=normalizeQ(it.q);
    const existingDup=findDuplicateInMeeting(mid,it.q,null);
    const batchDup=!existingDup && seenNorms[norm];
    const isDup=!!(existingDup||batchDup);
    if(isDup) dupCount++;
    else seenNorms[norm]=true;
    let dupNote='';
    if(existingDup){
      const esec=STATE.sections.find(function(s){return s.id===existingDup.sectionId;});
      dupNote='<div class="editor-hint" style="color:var(--rose);margin-top:3px">Already exists'+(esec?(' in "'+esc(esec.title)+'"'):'')+'</div>';
    }else if(batchDup){
      dupNote='<div class="editor-hint" style="color:var(--rose);margin-top:3px">Duplicate within this batch</div>';
    }
    rows+='<div class="bulk-row" '+(isDup?'style="opacity:.55"':'')+'>'+
        '<input type="checkbox" id="bulk_inc_'+i+'" '+(isDup?'':'checked')+' '+(isDup?'disabled':'')+'>'+
        '<div class="bulk-q">'+esc(it.q)+dupNote+'</div>'+
        '<select id="bulk_sec_'+i+'" '+(isDup?'disabled':'')+'>'+opts+'</select>'+
      '</div>';
  });
  return '<p class="editor-hint" style="margin:2px 0 6px">'+((res.items||[]).length)+' question(s) detected'+(newNames.length?(' · '+newNames.length+' new section(s) proposed'):'')+(dupCount?(' · <span style="color:var(--rose)">'+dupCount+' duplicate(s) auto-skipped</span>'):'')+'. Untick any you don\'t want, or change the target section.</p>'+
    '<div class="bulk-list">'+rows+'</div>'+
    '<div class="modal-actions">'+
      '<button class="btn primary tiny" data-action="bulk-confirm">Add to workspace</button>'+
      '<button class="btn tiny" data-action="bulk-back">Back</button>'+
    '</div>';
}

function collectBulkPlan(){

function transcriptPreviewHTML(res){
  const mid=UI.currentMeetingId;
  const validQids={}; meetingQuestions(mid).forEach(function(q){ validQids[q.id]=q; });
  const answers=(res.answers||[]).filter(function(a){ return a && a.id && validQids[a.id] && a.answer && String(a.answer).trim(); });
  const newQs=(res.newQuestions||[]).filter(function(nq){ return nq && nq.q && String(nq.q).trim(); });

  let ansRows='';
  answers.forEach(function(a,i){
    const q=validQids[a.id];
    ansRows+='<div class="bulk-row" style="align-items:flex-start;flex-direction:column;gap:6px">'+
      '<div style="display:flex;gap:10px;align-items:flex-start;width:100%">'+
        '<input type="checkbox" id="tr_ans_inc_'+i+'" checked style="margin-top:4px">'+
        '<div style="flex:1">'+
          '<div class="editor-hint" style="margin-bottom:3px">Q: '+esc(q.text)+'</div>'+
          '<textarea id="tr_ans_text_'+i+'" class="result-editor-ta" style="min-height:52px">'+esc(a.answer)+'</textarea>'+
        '</div>'+
      '</div>'+
    '</div>';
  });

  const secs=meetingSections(mid);
  let newRows='';
  const seenNorms={};
  newQs.forEach(function(nq,i){
    const dup=findDuplicateInMeeting(mid,nq.q,null);
    const norm=normalizeQ(nq.q);
    const batchDup=!dup && seenNorms[norm];
    const isDup=!!(dup||batchDup);
    if(!isDup) seenNorms[norm]=true;
    let opts=''; secs.forEach(function(s){ opts+='<option value="ex::'+s.id+'">'+esc(s.title)+'</option>'; });
    opts+='<option value="new" selected>+ New section "FROM TRANSCRIPT"</option>';
    let dupNote='';
    if(dup){ const esec=STATE.sections.find(function(s){return s.id===dup.sectionId;}); dupNote='<div class="editor-hint" style="color:var(--rose);margin-top:3px">Already exists'+(esec?(' in "'+esc(esec.title)+'"'):'')+'</div>'; }
    else if(batchDup){ dupNote='<div class="editor-hint" style="color:var(--rose);margin-top:3px">Duplicate within this transcript</div>'; }
    const rowStyle='align-items:flex-start;flex-direction:column;gap:6px'+(isDup?';opacity:.55':'');
    newRows+='<div class="bulk-row" style="'+rowStyle+'">'+
      '<div style="display:flex;gap:10px;align-items:flex-start;width:100%">'+
        '<input type="checkbox" id="tr_new_inc_'+i+'" '+(isDup?'':'checked')+' '+(isDup?'disabled':'')+' style="margin-top:4px">'+
        '<div style="flex:1">'+
          '<div class="bulk-q">'+esc(nq.q)+'</div>'+dupNote+
          (nq.a?('<textarea id="tr_new_ans_'+i+'" class="result-editor-ta" style="min-height:46px;margin-top:6px" placeholder="Answer captured from transcript (optional, editable)">'+esc(nq.a)+'</textarea>'):'')+
        '</div>'+
        '<select id="tr_new_sec_'+i+'" '+(isDup?'disabled':'')+'>'+opts+'</select>'+
      '</div>'+
    '</div>';
  });

  return '<p class="editor-hint" style="margin:2px 0 10px">Found '+answers.length+' matched answer(s) and '+newQs.length+' new question(s).</p>'+
    (answers.length?('<h3 style="font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:10px 0 6px">Matched answers</h3><div class="bulk-list">'+ansRows+'</div>'):'')+
    (newQs.length?('<h3 style="font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px">New questions heard in transcript</h3><div class="bulk-list">'+newRows+'</div>'):'')+
    (!answers.length && !newQs.length ? '<p class="empty-hint">Nothing usable was detected in this transcript.</p>' : '')+
    '<div class="modal-actions">'+
      '<button class="btn primary tiny" data-action="transcript-confirm">Add to workspace</button>'+
      '<button class="btn tiny" data-action="transcript-back">Back</button>'+
    '</div>';
}

function collectTranscriptPlan(){
  const res=UI.transcriptResult; if(!res) return {answers:[],newQuestions:[]};
  const mid=UI.currentMeetingId;
  const validQids={}; meetingQuestions(mid).forEach(function(q){ validQids[q.id]=q; });
  const answersSrc=(res.answers||[]).filter(function(a){ return a&&a.id&&validQids[a.id]&&a.answer&&String(a.answer).trim(); });
  const newSrc=(res.newQuestions||[]).filter(function(nq){ return nq&&nq.q&&String(nq.q).trim(); });

  const answers=[];
  answersSrc.forEach(function(a,i){
    const inc=document.getElementById('tr_ans_inc_'+i);
    if(!inc||!inc.checked) return;
    const ta=document.getElementById('tr_ans_text_'+i);
    const txt=(ta&&ta.value||'').trim();
    if(!txt) return;
    answers.push({ id:a.id, text:txt });
  });

  const newQuestions=[];
  newSrc.forEach(function(nq,i){
    const inc=document.getElementById('tr_new_inc_'+i);
    if(!inc || !inc.checked || inc.disabled) return;
    const sel=document.getElementById('tr_new_sec_'+i);
    const target=sel?sel.value:'new';
    const ansTa=document.getElementById('tr_new_ans_'+i);
    const ansTxt=ansTa?(ansTa.value||'').trim():'';
    newQuestions.push({ q:nq.q, target:target, answer:ansTxt });
  });

  return { answers:answers, newQuestions:newQuestions };
}

      if(lateSkipped.length){ toast(addedCount+' added, '+lateSkipped.length+' skipped as duplicate'); UI.infoModal={title:'Duplicates skipped',message:'Added '+addedCount+' question(s).\n\nSkipped '+lateSkipped.length+' duplicate(s) that already existed:\n\n'+lateSkipped.join('\n')}; render(); }
      else{ toast(addedCount+' question'+(addedCount!==1?'s':'')+' added'); }
      break;
    }

    case 'open-transcript':{
      if(!isAdmin()){ toast('Admins only'); break; }
      UI.transcriptOpen=true; UI.transcriptResult=null; UI.transcriptError=null; UI.transcriptText=''; UI.transcriptBusy=false; render(); break;
    }
    case 'close-transcript': UI.transcriptOpen=false; render(); break;
    case 'transcript-back': UI.transcriptResult=null; render(); break;
    case 'transcript-run-ai':{
      const ta=document.getElementById('transcriptText');
      const raw=(ta&&ta.value||'').trim();
      if(!raw){ toast('Paste a transcript first'); break; }
      UI.transcriptText=raw; UI.transcriptBusy=true; UI.transcriptError=null; UI.transcriptResult=null; render();
      try{
        const qList=meetingQuestions(UI.currentMeetingId).map(function(q){ return {id:q.id, text:q.text}; });
        const res=await aiAnalyzeTranscript(raw, qList);
        if(!res || !Array.isArray(res.answers) || !Array.isArray(res.newQuestions)) throw new Error('unexpected response shape');
        UI.transcriptResult=res; UI.transcriptBusy=false; render();
      }catch(err){
        UI.transcriptBusy=false; UI.transcriptError='Transcript analysis failed: '+((err&&err.message)?err.message:'unknown'); render();
      }
      break;
    }
    case 'transcript-confirm':{
      const plan=collectTranscriptPlan();
      if(!plan.answers.length && !plan.newQuestions.length){ toast('Nothing selected'); break; }
      const mid=UI.currentMeetingId;
      let answeredCount=0, createdCount=0;
      await mutate(function(d){
        const autoId=ensureAutoTranscriptUser(d);
        plan.answers.forEach(function(item){
          const q=d.questions.find(function(x){return x.id===item.id;});
          if(!q) return;
          let a=d.answers.find(function(x){return x.questionId===item.id && x.userId===autoId;});
          if(a){ a.text=item.text; a.updatedAt=new Date().toISOString(); }
          else{ d.answers.push({id:uid('ans'),questionId:item.id,userId:autoId,text:item.text,updatedAt:new Date().toISOString()}); }
          syncStatus(d,q);
          answeredCount++;
        });
        const existingSecByTitle={}; d.sections.filter(function(s){return s.meetingId===mid;}).forEach(function(s){ existingSecByTitle[s.title.toLowerCase()]=s.id; });
        function ensureSection(name){
          const key=String(name).toLowerCase();
          if(existingSecByTitle[key]) return existingSecByTitle[key];
          const mo=d.sections.filter(function(s){return s.meetingId===mid;}).reduce(function(m,s){return Math.max(m,s.order);},-1);
          const sid=uid('sec'); d.sections.push({id:sid,meetingId:mid,title:String(name).toUpperCase(),order:mo+1});
          existingSecByTitle[key]=sid; return sid;
        }
        plan.newQuestions.forEach(function(row){
          const norm=normalizeQ(row.q);
          const dupNow=d.questions.find(function(q){ return q.meetingId===mid && normalizeQ(q.text)===norm; });
          if(dupNow) return;
          let sid;
          if(row.target.indexOf('ex::')===0) sid=row.target.slice(4);
          else sid=ensureSection('FROM TRANSCRIPT');
          if(!d.sections.find(function(s){return s.id===sid&&s.meetingId===mid;})) sid=ensureSection('FROM TRANSCRIPT');
          const mq=d.questions.filter(function(q){return q.sectionId===sid;}).reduce(function(m,q){return Math.max(m,q.order);},-1);
          const newQ={id:uid('q'),meetingId:mid,sectionId:sid,text:row.q,status:'open',order:mq+1,result:null,resultFromAnswerId:null,resultBy:null,resultAt:null};
          d.questions.push(newQ);
          createdCount++;
          if(row.answer){
            d.answers.push({id:uid('ans'),questionId:newQ.id,userId:autoId,text:row.answer,updatedAt:new Date().toISOString()});
            syncStatus(d,newQ);
          }
        });
      });
      UI.transcriptOpen=false; UI.transcriptResult=null; UI.transcriptText=''; UI.transcriptError=null;
      toast(answeredCount+' answer(s) added, '+createdCount+' new question(s) created'); break;
    }
  }
});

document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && !e.shiftKey && e.target && e.target.id==='inputModalField'){
    e.preventDefault();
    const sb=document.querySelector('[data-action="input-submit"]');
    if(sb) sb.click();
    return;
  }
  if(e.key!=='Enter') return;
  if(!UI.pwModal) return;
  const tag=e.target && e.target.tagName;
  if(tag!=='INPUT') return;
  e.preventDefault();
  const btn=document.querySelector('.modal-overlay [data-action^="pw-submit-"]');
  if(btn) btn.click();
});

document.addEventListener('change', async function(e){
  const sw=e.target.closest('[data-action="switch-workspace"]');
  if(sw){ UI.currentMeetingId=sw.value; UI.filter='all'; UI.exportOpen=false; UI.bulkOpen=false; UI.bulkStatusMode=false; UI.bulkSelected={}; render(); return; }
});

/* ============================ BOOT ============================ */
/* Only used when the shared database is empty and nobody has loaded the starter content yet. */
async function bootstrapSeed(){
  const holder='h_'+Math.random().toString(36).slice(2);
  let lease;
  try{ lease=await DB.doc('meta/seed').acquire({holder:holder,ttlMs:120000}); }catch(e){ return false; }
  if(!lease || !lease.acquired) return false;
  const check=remoteState();
  if(check.users.length || check.projects.length) return true;
  lastBase={};
  const ok=await storeSet(seed());
  return ok;
}
(async function init(){
  const app=document.getElementById('app');
  app.innerHTML='<p class="empty-hint" style="text-align:center;padding:40px 0">Loading shared data…</p>';
  DB=await getDb(); hasStore=!!DB;
  let data=null;
  if(hasStore){
    const definitive=await startSync();
    data=await storeGet();
    if(!data && definitive){
      await bootstrapSeed();
      for(let i=0;i<10 && !data;i++){ data=await storeGet(); if(!data) await delay(2000); }
    }
    if(!data){
      app.innerHTML='<div class="storage-warn">Could not load the shared data yet. Reload the page in a moment. If this keeps happening, check that you have access to this artifact.</div>';
      return;
    }
  }else{
    data=seed(); memFallback=data;
  }
  STATE=data; render();
})();
